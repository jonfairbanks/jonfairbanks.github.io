version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # eslint-config-next 16.2.12 uses typescript-eslint, which supports
      # TypeScript through 6.0.x but not TypeScript 7 yet.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps"
