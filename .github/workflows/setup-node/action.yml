name: Setup Node.js
description: Install locked dependencies with a supported Node.js runtime
inputs:
  node-version:
    description: Node.js version
    default: "24"
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - name: Install Dependencies
      shell: bash
      run: npm ci
